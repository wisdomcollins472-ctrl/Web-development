<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Benson Idahosa University mark">
  <title>Benson Idahosa University</title>
  <defs>
    <linearGradient id="bronze" x1="14" y1="6" x2="50" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4D89A"/>
      <stop offset=".38" stop-color="#D8A93F"/>
      <stop offset=".72" stop-color="#A9761F"/>
      <stop offset="1" stop-color="#E2BE66"/>
    </linearGradient>
    <linearGradient id="sheen" x1="20" y1="8" x2="44" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6DF" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#FFF6DF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- cast-bronze lozenge, the silhouette of an Edo court pendant -->
  <path d="M32 2.5C41 11 53 23.5 53 33.6 53 49.4 44.1 61.5 32 61.5S11 49.4 11 33.6C11 23.5 23 11 32 2.5Z" fill="url(#bronze)"/>
  <path d="M32 2.5C41 11 53 23.5 53 33.6 53 49.4 44.1 61.5 32 61.5Z" fill="url(#sheen)"/>

  <!-- open book, cut from the metal -->
  <g fill="#0B1A15">
    <path d="M32 26.4c-3.1-2.6-7.1-4.3-11.4-4.6-1.3-.1-2.1 1-2.1 2.2v14.9c0 1.4 1.1 2.4 2.4 2.3 4-.3 7.6 1 10.3 3.1.5.4 1.2.4 1.6 0 2.7-2.1 6.3-3.4 10.3-3.1 1.3.1 2.4-.9 2.4-2.3V24c0-1.2-.8-2.3-2.1-2.2-4.3.3-8.3 2-11.4 4.6Z"/>
  </g>
  <!-- spine -->
  <path d="M32 27.6v18.2" stroke="#D8A93F" stroke-width="2.1" stroke-linecap="round"/>
  <!-- lamp: a small flame above the book -->
  <path d="M32 11.6c2.5 2.7 3.7 4.6 3.7 6.3a3.7 3.7 0 0 1-7.4 0c0-1.7 1.2-3.6 3.7-6.3Z" fill="#0B1A15" opacity=".9"/>
